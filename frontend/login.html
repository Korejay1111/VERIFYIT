<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — VerifyIt</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    body { margin: 0; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    .auth-container {
      width: 100%;
      max-width: 450px;
      padding: 2rem;
      background: var(--bg-secondary);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-logo {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .auth-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0.5rem 0;
    }
    .auth-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin: 0.5rem 0 0 0;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-label {
      display: block;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }
    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      transition: all 0.2s;
      box-sizing: border-box;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      background: var(--bg-secondary);
    }
    .error-message {
      color: #ef4444;
      font-size: 0.9rem;
      margin-top: 0.25rem;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .auth-button {
      width: 100%;
      padding: 0.875rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--accent-primary);
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 1rem;
    }
    .auth-button:hover:not(:disabled) {
      background: var(--accent-primary-dark, #0066cc);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 102, 255, 0.3);
    }
    .auth-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.95rem;
    }
    .auth-footer a {
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .loading {
      display: none;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .success-message {
      background: #dbeafe;
      color: #0c4a6e;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: none;
      text-align: center;
    }
    .success-message.show {
      display: block;
    }
  </style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-logo"><i class="fas fa-check"></i></div>
      <h1 class="auth-title">Verify<span class="brand-accent">It</span></h1>
      <p class="auth-subtitle">Login to your account</p>
    </div>

    <div class="success-message" id="successMessage">
      Login successful! Redirecting...
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          class="form-input" 
          placeholder="Enter your username"
          required
          autocomplete="username"
        >
        <div class="error-message" id="usernameError"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="Enter your password"
          required
          autocomplete="current-password"
        >
        <div class="error-message" id="passwordError"></div>
      </div>

      <div class="error-message" id="generalError"></div>

      <button type="submit" class="auth-button btn btn-primary" id="loginBtn">
        Login
      </button>

      <div class="loading" id="loading">
        Logging in...
      </div>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Sign up here</a>
    </div>
  </div>

  <script src="auth.js?v=2"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await handleLogin();
    });

    async function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const loading = document.getElementById('loading');
      const generalError = document.getElementById('generalError');

      // Clear errors
      document.getElementById('usernameError').textContent = '';
      document.getElementById('passwordError').textContent = '';
      generalError.textContent = '';
      generalError.classList.remove('show');

      // Validate
      if (!username || !password) {
        generalError.textContent = 'Please fill in all fields';
        generalError.classList.add('show');
        return;
      }

      loginBtn.disabled = true;
      loading.style.display = 'block';

      try {
        const response = await fetch(`${API_BASE_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Save token
          localStorage.setItem('verifyit-token', data.access_token);
          localStorage.setItem('verifyit-user', JSON.stringify(data.user));
          
          document.getElementById('successMessage').classList.add('show');
          setTimeout(() => {
            window.location.href = 'home.html';
          }, 1000);
        } else {
          generalError.textContent = data.detail || 'Login failed. Please try again.';
          generalError.classList.add('show');
        }
      } catch (error) {
        console.error('Login error:', error);
        generalError.textContent = 'Connection error. Please try again.';
        generalError.classList.add('show');
      } finally {
        loginBtn.disabled = false;
        loading.style.display = 'none';
      }
    }

    // Initialize theme
    initTheme?.();
    initThemeSelector?.();
  </script>
</body>
</html>
