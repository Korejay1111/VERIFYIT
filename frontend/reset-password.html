<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Choose a New Password — iConfam</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    body { margin: 0; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 1rem; }
    .auth-container { width: 100%; max-width: 450px; padding: 2rem; background: var(--bg-secondary); border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-logo { font-size: 3rem; margin-bottom: 1rem; }
    .auth-title { font-size: 1.75rem; font-weight: 700; margin: 0.5rem 0; }
    .auth-subtitle { font-size: 0.95rem; color: var(--text-muted); margin: 0.5rem 0 0; }
    .form-group { margin-bottom: 1.5rem; }
    .form-label { display: block; font-size: 0.95rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-primary); }
    .form-input { width: 100%; padding: 0.75rem 1rem; font-size: 1rem; border: 2px solid var(--border-color); border-radius: 8px; background: var(--bg-tertiary); color: var(--text-primary); box-sizing: border-box; }
    .form-input:focus { outline: none; border-color: var(--accent-primary); background: var(--bg-secondary); }
    .auth-button { width: 100%; padding: 0.875rem 1.5rem; font-size: 1rem; font-weight: 600; border: 0; border-radius: 8px; background: var(--accent-primary); color: white; cursor: pointer; margin-top: 1rem; }
    .auth-button:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.95rem; }
    .auth-footer a { color: var(--accent-primary); text-decoration: none; font-weight: 500; }
    .auth-message { display: none; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; color: var(--text-primary); background: var(--bg-card); }
    .auth-message.show { display: block; }
    .auth-message.error { color: var(--danger); }
  </style>
</head>
<body>
  <main class="auth-container">
    <header class="auth-header">
      <div class="auth-logo"><i class="fas fa-check"></i></div>
      <h1 class="auth-title">Choose a new password</h1>
      <p class="auth-subtitle">Your password must be at least 8 characters long.</p>
    </header>

    <div id="resetPasswordMessage" class="auth-message" role="status" aria-live="polite"></div>
    <form id="resetPasswordForm">
      <div class="form-group">
        <label class="form-label" for="newPassword">New password</label>
        <div class="password-field">
          <input type="password" id="newPassword" class="form-input" required minlength="8" autocomplete="new-password">
          <button type="button" class="password-toggle" data-password-toggle aria-controls="newPassword" aria-label="Show password" aria-pressed="false">
            <i class="fas fa-eye" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm new password</label>
        <div class="password-field">
          <input type="password" id="confirmPassword" class="form-input" required minlength="8" autocomplete="new-password">
          <button type="button" class="password-toggle" data-password-toggle aria-controls="confirmPassword" aria-label="Show password" aria-pressed="false">
            <i class="fas fa-eye" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="auth-button btn btn-primary" id="resetPasswordBtn">Save new password</button>
    </form>

    <div class="auth-footer"><a href="login.html">Back to login</a></div>
  </main>

  <script src="auth.js?v=3"></script>
  <script>
    const resetToken = new URLSearchParams(window.location.search).get('token');
    window.history.replaceState({}, document.title, window.location.pathname);
    const resetForm = document.getElementById('resetPasswordForm');
    const resetButton = document.getElementById('resetPasswordBtn');
    const resetMessage = document.getElementById('resetPasswordMessage');

    if (!resetToken) {
      resetMessage.textContent = 'This reset link is incomplete. Request a new one.';
      resetMessage.classList.add('show', 'error');
      resetButton.disabled = true;
    }

    resetForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      resetMessage.className = 'auth-message';
      resetMessage.textContent = '';
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (newPassword !== confirmPassword) {
        resetMessage.textContent = 'The passwords do not match.';
        resetMessage.classList.add('show', 'error');
        return;
      }

      resetButton.disabled = true;
      try {
        const response = await fetch(`${API_BASE_URL}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: resetToken, new_password: newPassword })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Could not reset your password.');
        resetForm.hidden = true;
        resetMessage.textContent = data.message;
        resetMessage.classList.add('show');
      } catch (error) {
        resetMessage.textContent = error.message || 'Could not reach the server. Please try again.';
        resetMessage.classList.add('show', 'error');
        resetButton.disabled = false;
      }
    });
  </script>
</body>
</html>
