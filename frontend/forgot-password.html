<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — iConfam</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    body { margin: 0; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 1rem; }
    .auth-container { width: 100%; max-width: 450px; padding: 2rem; background: var(--bg-secondary); border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-logo { font-size: 3rem; margin-bottom: 1rem; }
    .auth-title { font-size: 1.75rem; font-weight: 700; margin: 0.5rem 0; }
    .auth-subtitle { font-size: 0.95rem; color: var(--text-muted); margin: 0.5rem 0 0; }
    .form-group { margin-bottom: 1.5rem; }
    .form-label { display: block; font-size: 0.95rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-primary); }
    .form-input { width: 100%; padding: 0.75rem 1rem; font-size: 1rem; border: 2px solid var(--border-color); border-radius: 8px; background: var(--bg-tertiary); color: var(--text-primary); box-sizing: border-box; }
    .form-input:focus { outline: none; border-color: var(--accent-primary); background: var(--bg-secondary); }
    .auth-button { width: 100%; padding: 0.875rem 1.5rem; font-size: 1rem; font-weight: 600; border: 0; border-radius: 8px; background: var(--accent-primary); color: white; cursor: pointer; margin-top: 1rem; }
    .auth-button:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.95rem; }
    .auth-footer a { color: var(--accent-primary); text-decoration: none; font-weight: 500; }
    .auth-message { display: none; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; color: var(--text-primary); background: var(--bg-card); }
    .auth-message.show { display: block; }
    .auth-message.error { color: var(--danger); }
  </style>
</head>
<body>
  <main class="auth-container">
    <header class="auth-header">
      <div class="auth-logo"><i class="fas fa-check"></i></div>
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-subtitle">Enter the email address linked to your account. We’ll send you a secure reset link.</p>
    </header>

    <div id="resetRequestMessage" class="auth-message" role="status" aria-live="polite"></div>
    <form id="forgotPasswordForm">
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
      </div>
      <button type="submit" class="auth-button btn btn-primary" id="sendResetLinkBtn">Send reset link</button>
    </form>

    <div class="auth-footer"><a href="login.html">Back to login</a></div>
  </main>

  <script src="auth.js?v=3"></script>
  <script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('sendResetLinkBtn');
      const message = document.getElementById('resetRequestMessage');
      button.disabled = true;
      message.className = 'auth-message';
      message.textContent = '';

      try {
        const response = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Could not request a password reset.');
        message.textContent = data.message;
        message.classList.add('show');
      } catch (error) {
        message.textContent = error.message || 'Could not reach the server. Please try again.';
        message.classList.add('show', 'error');
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
